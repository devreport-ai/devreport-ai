name: Close Issues on Dev Merge

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: read
  issues: write

concurrency:
  group: close-issues-on-dev-merge
  queue: max

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const issueNumbers = new Set(
              [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)(?:\s*:\s*|\s+)#(\d+)/gi)]
                .map((match) => Number(match[1])),
            );

            for (const issue_number of issueNumbers) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number,
                }));
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }

              if (issue.pull_request || issue.state === "closed") continue;

              const marker = `<!-- close-issues-on-dev-merge:pr-${context.issue.number} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number,
                per_page: 100,
              });
              if (!comments.some((comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker))) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number,
                  body: `PR #${context.issue.number}이 \`dev\` 브랜치에 병합되어 자동 완료 처리를 진행합니다.\n\n${marker}`,
                });
              }

              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });
            }
