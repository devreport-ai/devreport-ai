# main 병합 시 전체 서비스를 운영 서버에 배포한다.
#
# 이미지는 서버와 같은 linux/arm64 러너에서 네이티브로 빌드한다. 운영 서버는
# 1 vCPU 라 거기서 빌드하면 매우 느리고 메모리도 부족하다.
name: Deploy

on:
  push:
    branches: [main]
  # 배포만 다시 돌려야 할 때를 위해 수동 실행도 열어 둔다.
  workflow_dispatch:

# 배포가 겹치면 서버 상태를 예측할 수 없으므로 이전 실행을 기다린다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/devreport

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      # 하나가 실패해도 나머지 로그를 봐야 원인을 찾기 쉽다.
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: ai-service
            dockerfile: ai/Dockerfile
          - name: web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Dockerfile 이 contracts/ 를 참조하므로 저장소 루트가 컨텍스트다.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          # 롤백할 수 있도록 커밋 SHA 태그를 함께 남긴다.
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 호스트 키를 미리 고정해 중간자 공격을 막는다.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: compose 파일 전송
        run: |
          scp -i ~/.ssh/deploy_key infra/compose.prod.yaml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/devreport/compose.prod.yaml

      - name: 배포
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='${{ github.actor }}' SHA='${{ github.sha }}' bash -s" <<'SCRIPT'
          set -euo pipefail
          cd /opt/devreport

          # 이미지는 저장소 소유 패키지라 토큰으로 받아야 한다.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # 다음 수동 실행도 같은 버전을 쓰도록 .env.prod 에 태그를 기록한다.
          sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$SHA|" .env.prod

          docker compose --env-file .env.prod -f compose.prod.yaml pull
          docker compose --env-file .env.prod -f compose.prod.yaml up -d --remove-orphans

          docker logout ghcr.io
          # 오래된 이미지가 45GB 디스크를 채우지 않게 정리한다. 최근 것은 롤백용으로 남긴다.
          docker image prune -f --filter "until=168h"
          SCRIPT

      # 루트 경로는 Backend가 죽어 있어도 Caddy가 index.html을 200으로 돌려준다.
      # 따라서 컨테이너 헬스 상태를 직접 확인해야 한다.
      - name: 컨테이너 상태 확인
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' <<'SCRIPT'
          set -uo pipefail
          cd /opt/devreport
          compose="docker compose --env-file .env.prod -f compose.prod.yaml"
          for i in $(seq 1 30); do
            # 헬스체크가 있는 서비스는 healthy, 나머지는 running이어야 한다.
            bad=$($compose ps --format '{{.Service}}|{{.State}}|{{.Health}}' \
              | awk -F'|' '$2 != "running" || ($3 != "" && $3 != "healthy")')
            if [ -z "$bad" ]; then
              echo "모든 컨테이너 정상"
              $compose ps --format '{{.Service}} {{.State}} {{.Health}}'
              exit 0
            fi
            echo "[$i] 대기 중"
            echo "$bad"
            sleep 10
          done
          echo "컨테이너가 정상 상태에 도달하지 못했다"
          $compose ps
          $compose logs --tail 60
          exit 1
          SCRIPT

      - name: 공개 엔드포인트 확인
        run: |
          # Caddy가 정적 파일을 서빙하는지
          page=$(curl -sS -o /dev/null -w "%{http_code}" https://beta-app.kr/ --max-time 20 || echo 000)
          # 요청이 Backend까지 실제로 닿는지. 토큰이 없으므로 401이 정상 응답이다.
          api=$(curl -sS -o /dev/null -w "%{http_code}" https://beta-app.kr/api/auth/me --max-time 20 || echo 000)
          echo "page=$page api=$api"
          [ "$page" = "200" ] || { echo "정적 파일 응답 실패"; exit 1; }
          [ "$api" = "401" ] || { echo "Backend 응답 실패"; exit 1; }
          echo "배포 확인 완료"
