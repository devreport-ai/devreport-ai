name: 일반 작업
description: 설정, 문서, 리팩터링 등 일반 작업을 등록합니다.
title: "[Task] "
labels: []
body:
  - type: dropdown
    id: area
    attributes:
      label: 담당 영역
      options:
        - Backend
        - Frontend
        - AI
        - Contracts
        - Infra
        - Common
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 작업 설명
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: 체크리스트
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 검증 완료
        - [ ] 관련 문서 반영
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: 작업 브랜치
      placeholder: chore/example
