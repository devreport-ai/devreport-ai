name: 기능 개발
description: 새로운 기능 또는 개선 작업을 등록합니다.
title: "[Feature] "
labels: []
body:
  - type: dropdown
    id: area
    attributes:
      label: 담당 영역
      options:
        - Backend
        - Frontend
        - AI
        - Contracts
        - Infra
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 작업으로 달성하려는 결과를 작성해주세요.
      placeholder: 구현하려는 기능과 필요한 이유
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 구현할 작업을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 이 이슈를 완료로 판단할 수 있는 기준을 작성해주세요.
      placeholder: |
        - [ ] 테스트 통과
        - [ ] 문서 반영
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: 작업 브랜치
      placeholder: feat/backend/example
