openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: DevReport AI API
  version: 0.1.0
  description: |
    인증 요청의 IP별 rate limit은 Spring의 `server.forward-headers-strategy=framework`로
    해석된 클라이언트 IP를 사용한다. 배포 시 신뢰된 reverse proxy 또는 ingress만
    `Forwarded`/`X-Forwarded-For`를 정규화해 전달하고, 외부에서 전달된 forwarded header는
    제거해야 한다. Refresh Token은 `refresh_token` HttpOnly 쿠키로만 전달하며,
    Frontend는 인증 요청에 credentials를 포함해야 한다. Backend는 명시된 허용 Origin만
    credentials 요청에 허용하고, 쿠키를 사용하는 인증 요청의 Origin 또는 Referer를 검증한다.

servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly·SameSite Refresh Token 쿠키. JavaScript에서 읽을 수 없다.
  schemas:
    SignupRequest:
      type: object
      required: [email, password, name, privacyPolicyVersion, termsOfServiceVersion]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: UTF-8 인코딩 기준 최대 72바이트
        name:
          type: string
          maxLength: 100
        privacyPolicyVersion:
          type: string
          maxLength: 50
          example: '2026-08-14'
          description: 회원가입 시 확인한 개인정보처리방침 버전
        termsOfServiceVersion:
          type: string
          maxLength: 50
          example: '2026-08-14'
          description: 회원가입 시 확인한 이용약관 버전
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: UTF-8 인코딩 기준 최대 72바이트
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: UTF-8 인코딩 기준 최대 72바이트
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Access Token 유효 시간(초)
    UserResponse:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    ProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          maxLength: 100
    ProjectIdResponse:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string
          format: uuid
    ProjectResponse:
      type: object
      required: [id, name, ownerId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectResponse"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    TrashedProjectResponse:
      type: object
      required: [id, name, deletedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        deletedAt:
          type: string
          format: date-time
    TrashedProjectPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrashedProjectResponse"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    FileIdResponse:
      type: object
      required: [fileId]
      properties:
        fileId:
          type: string
          format: uuid
    FileResponse:
      type: object
      required: [id, originalName, contentType, size, createdAt]
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520
        createdAt:
          type: string
          format: date-time
    FilePageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FileResponse"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ReportSummaryResponse:
      type: object
      required: [id, templateId, templateVersion, version, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        templateId:
          type: [string, "null"]
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
        templateVersion:
          type: [integer, "null"]
          minimum: 1
        version:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    ReportPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportSummaryResponse"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ReportPresentationSettings:
      type: object
      propertyNames:
        pattern: '^[A-Za-z][A-Za-z0-9_-]{0,63}$'
      additionalProperties:
        type: [string, number, boolean, "null"]
    ReportUpdateRequest:
      type: object
      required: [document, templateId, templateVersion, presentationSettings, expectedVersion]
      properties:
        document:
          $ref: "report-document.schema.json"
        templateId:
          type: [string, "null"]
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
        templateVersion:
          type: [integer, "null"]
          minimum: 1
        presentationSettings:
          $ref: "#/components/schemas/ReportPresentationSettings"
        expectedVersion:
          type: integer
          minimum: 0
      oneOf:
        - properties:
            templateId:
              type: "null"
            templateVersion:
              type: "null"
        - properties:
            templateId:
              type: string
            templateVersion:
              type: integer
    GenerationRequest:
      type: object
      required: [fileIds, metadata, instructions]
      properties:
        fileIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        metadata:
          type: object
          required: [title]
          properties:
            title:
              type: string
              minLength: 1
            author:
              type: string
            course:
              type: string
            date:
              type: string
              format: date
          additionalProperties: false
        instructions:
          type: string
          minLength: 1
        provider:
          description: |
            생성에 사용할 LLM provider. model과 함께 지정하거나 둘 다 생략한다.
            생략하면 서버 기본 모델(서버 키)로 실행한다. 선택한 provider의 API Key를
            등록한 사용자는 해당 키로 실행되며, 서버 기본 모델이 아닌 모델은 키가 있어야 선택할 수 있다.
          oneOf:
            - $ref: "#/components/schemas/AiProvider"
            - type: "null"
        model:
          description: "`GET /api/ai/models` allowlist의 model 값. provider와 함께 지정한다."
          type: [string, "null"]
          maxLength: 100
      additionalProperties: false
    AiProvider:
      type: string
      enum: [GEMINI, ANTHROPIC]
    AiCredentialRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          format: password
          minLength: 8
          maxLength: 512
          description: provider API Key 원문. 저장 전 provider API로 검증하며 어떤 응답에도 다시 노출되지 않는다.
      additionalProperties: false
    AiCredentialResponse:
      type: object
      required: [provider, keyHint, verifiedAt, createdAt, updatedAt]
      properties:
        provider:
          $ref: "#/components/schemas/AiProvider"
        keyHint:
          type: string
          description: "마스킹된 힌트(`****` + 끝 4자리)."
        verifiedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AiCredentialListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AiCredentialResponse"
    AiModelOption:
      type: object
      required: [provider, model, label, serverDefault, available, usesUserKey]
      properties:
        provider:
          $ref: "#/components/schemas/AiProvider"
        model:
          type: string
        label:
          type: string
        serverDefault:
          type: boolean
          description: 서버 키로 실행되는 기본 모델이면 true. 목록에 정확히 하나 있다.
        available:
          type: boolean
          description: 현재 사용자가 선택할 수 있으면 true (서버 기본 모델이거나 해당 provider 키를 등록함).
        usesUserKey:
          type: boolean
          description: |
            이 모델을 선택하면 사용자가 등록한 키로 실행되어 비용이 사용자 provider 계정에 청구되면 true.
            해당 provider 키가 등록되어 있으면 서버 기본 모델도 사용자 키로 실행된다.
    AiModelCatalogResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AiModelOption"
    JobIdResponse:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
          format: uuid
    GenerationJobResponse:
      type: object
      required: [jobId, status, progress, currentStage, provider, model, createdAt]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELED]
        progress:
          type: integer
          enum: [0, 10, 100]
        currentStage:
          type: string
          enum: [QUEUED, CALLING_AI, COMPLETED, FAILED, CANCELED]
        provider:
          $ref: "#/components/schemas/AiProvider"
        model:
          type: string
          description: 접수 시점에 확정된 모델 snapshot.
        reportId:
          type: [string, "null"]
          format: uuid
        failureCode:
          type: [string, "null"]
        failureMessage:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
    ExportIdResponse:
      type: object
      required: [exportId]
      properties:
        exportId:
          type: string
          format: uuid
    ReportExportResponse:
      type: object
      required: [exportId, reportId, status, createdAt]
      properties:
        exportId:
          type: string
          format: uuid
        reportId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, EXPIRED]
        size:
          type: [integer, "null"]
          format: int64
        failureCode:
          type: [string, "null"]
        failureMessage:
          type: [string, "null"]
        expiresAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
    ReportRenderDataResponse:
      type: object
      required: [exportId, reportId, projectId, reportVersion, document, templateId, templateVersion,
        presentationSettings, imageFileIds]
      properties:
        exportId:
          type: string
          format: uuid
        reportId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        reportVersion:
          type: integer
          format: int64
          minimum: 0
        document:
          $ref: "report-document.schema.json"
        templateId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
        templateVersion:
          type: integer
          minimum: 1
        presentationSettings:
          $ref: "#/components/schemas/ReportPresentationSettings"
        imageFileIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    ErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: [object, "null"]
        timestamp:
          type: string
          format: date-time

security:
  - bearerAuth: []

paths:
  /api/auth/signup:
    post:
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: IP별 회원가입 요청 한도 초과 (RATE_LIMIT_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 이메일 중복
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      summary: 로그인
      description: Access Token은 JSON 본문으로, Refresh Token은 HttpOnly 쿠키로 반환한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: HttpOnly Refresh Token 쿠키 (`refresh_token`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 허용되지 않은 Origin 또는 Referer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: IP별 로그인 요청 한도 초과 (RATE_LIMIT_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/refresh:
    post:
      summary: Access Token 재발급
      description: 요청 본문 없이 HttpOnly Refresh Token 쿠키를 읽어 토큰을 회전한다.
      security:
        - refreshTokenCookie: []
      responses:
        "200":
          description: 토큰 재발급 성공
          headers:
            Set-Cookie:
              description: 회전된 HttpOnly Refresh Token 쿠키 (`refresh_token`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Refresh Token 무효 또는 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 허용되지 않은 Origin 또는 Referer (CSRF_ORIGIN_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: IP별 refresh 요청 한도 초과 (RATE_LIMIT_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      summary: 로그아웃
      description: HttpOnly Refresh Token 쿠키를 폐기하고 만료된 쿠키를 반환한다.
      security:
        - refreshTokenCookie: []
      responses:
        "204":
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: 삭제된 Refresh Token 쿠키 (`Max-Age=0`).
              schema:
                type: string
        "403":
          description: 허용되지 않은 Origin 또는 Referer (CSRF_ORIGIN_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/password:
    post:
      summary: 비밀번호 변경
      description: 현재 비밀번호를 확인하고 새 비밀번호를 저장한 뒤 모든 Refresh Token을 폐기한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: 비밀번호 변경 성공. 기존 Refresh Token 쿠키도 삭제한다.
          headers:
            Set-Cookie:
              description: 폐기된 Refresh Token 쿠키 (`Max-Age=0`).
              schema:
                type: string
        "400":
          description: 입력값 오류, 현재 비밀번호 불일치 또는 새 비밀번호가 기존 값과 동일함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 허용되지 않은 Origin 또는 Referer (CSRF_ORIGIN_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: 사용자별 비밀번호 변경 요청 한도 초과 (RATE_LIMIT_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/me:
    get:
      summary: 내 정보 조회
      responses:
        "200":
          description: 사용자 정보 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/me/ai-credentials:
    get:
      summary: 등록한 provider API Key 목록 조회 (힌트만)
      responses:
        "200":
          description: 등록 목록. 키 원문은 포함하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCredentialListResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/me/ai-credentials/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/AiProvider"
    put:
      summary: provider API Key 등록 또는 교체
      description: |
        저장 전 AI Service를 통해 provider API로 키를 검증한다. Backend는 AES-256-GCM으로
        암호화해 보관하고 생성 실행 시에만 복호화한다. 키 원문은 DB·로그·응답·GenerationJob에
        남지 않는다. 교체하면 이전 키는 즉시 사용할 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiCredentialRequest"
      responses:
        "200":
          description: 등록 완료. 마스킹된 힌트만 반환한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCredentialResponse"
        "400":
          description: 키 형식 오류·provider가 키를 거부·아직 지원하지 않는 provider (VALIDATION_FAILED, AI_CREDENTIAL_INVALID, AI_PROVIDER_UNSUPPORTED, INVALID_REQUEST)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
