openapi: 3.0.3

info:
  title: DevReport AI API
  version: 0.1.0

servers:
  - url: http://localhost:8080

paths:
  /api/projects:
    post:
      summary: 프로젝트 생성
      responses:
        "201":
          description: 프로젝트 생성 성공

  /api/projects/{projectId}/files:
    post:
      summary: 프로젝트 파일 업로드
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: 파일 업로드 성공

  /api/projects/{projectId}/generations:
    post:
      summary: 보고서 생성 작업 시작
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: 생성 작업 접수

  /api/generations/{jobId}:
    get:
      summary: 생성 작업 상태 조회
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 생성 작업 상태

  /api/reports/{reportId}:
    get:
      summary: 보고서 조회
      responses:
        "200":
          description: 보고서 조회 성공

    put:
      summary: 보고서 수정
      responses:
        "200":
          description: 보고서 수정 성공