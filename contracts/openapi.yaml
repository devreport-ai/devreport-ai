openapi: 3.0.3

info:
  title: DevReport AI API
  version: 0.1.0

servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: UTF-8 인코딩 기준 최대 72바이트
        name:
          type: string
          maxLength: 100
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Access Token 유효 시간(초)
    UserResponse:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    ProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          maxLength: 100
    ProjectIdResponse:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string
          format: uuid
    ProjectResponse:
      type: object
      required: [id, name, ownerId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectResponse"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    TrashedProjectResponse:
      type: object
      required: [id, name, deletedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        deletedAt:
          type: string
          format: date-time
    TrashedProjectPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrashedProjectResponse"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    FileIdResponse:
      type: object
      required: [fileId]
      properties:
        fileId:
          type: string
          format: uuid
    FileResponse:
      type: object
      required: [id, originalName, contentType, size, createdAt]
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520
        createdAt:
          type: string
          format: date-time
    FilePageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FileResponse"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
        timestamp:
          type: string
          format: date-time

security:
  - bearerAuth: []

paths:
  /api/auth/signup:
    post:
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 이메일 중복
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/refresh:
    post:
      summary: Access Token 재발급
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: 토큰 재발급 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Refresh Token 무효 또는 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      summary: 로그아웃
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: 로그아웃 성공

  /api/auth/me:
    get:
      summary: 내 정보 조회
      responses:
        "200":
          description: 사용자 정보 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects:
    post:
      summary: 프로젝트 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequest"
      responses:
        "201":
          description: 프로젝트 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectIdResponse"
        "400":
          description: 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: 내 프로젝트 목록 조회
      parameters:
        - name: page
          in: query
          description: 0부터 시작하는 페이지 번호
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: 페이지당 프로젝트 수
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: 프로젝트 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPageResponse"
        "400":
          description: 잘못된 페이지 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: 프로젝트 상세 조회
      responses:
        "200":
          description: 프로젝트 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 프로젝트가 없거나 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: 프로젝트 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequest"
      responses:
        "200":
          description: 프로젝트 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 프로젝트가 없거나 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: 프로젝트를 휴지통으로 이동
      description: 프로젝트와 파일은 30일간 복구할 수 있으며 이후 자동으로 완전 삭제된다.
      responses:
        "204":
          description: 프로젝트 삭제 성공
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 프로젝트가 없거나 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/trash:
    get:
      summary: 휴지통 프로젝트 목록 조회
      parameters:
        - name: page
          in: query
          description: 0부터 시작하는 페이지 번호
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: 페이지당 프로젝트 수
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: 삭제 시각과 ID 내림차순 휴지통 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashedProjectPageResponse"
        "400":
          description: 잘못된 페이지 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/restore:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: 휴지통 프로젝트 복구
      responses:
        "200":
          description: 프로젝트와 파일 복구 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 휴지통에 프로젝트가 없거나 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/files:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: 프로젝트 파일 업로드
      description: |
        파일당 최대 크기는 20 MiB이다. PDF, DOCX, TXT, MD, ZIP, JPG/JPEG, PNG만 허용하며
        확장자, 요청 MIME, 실제 파일 형식이 모두 일치해야 한다. GIF와 WEBP는 MVP의
        보고서·AI 처리 호환 범위에서 제외되어 FILE_TYPE_NOT_ALLOWED로 거부된다.
        ZIP은 해제 용량 100 MiB와 내부 엔트리 1,000개로 제한하며 ZIP Slip, 환경변수,
        인증서·키, 실행 파일을 차단한다. java, kt, py, js, jsx, ts, tsx, html, css, scss,
        sql, xml, json, yaml, yml, md, txt, gradle, properties, toml, go, rs, c, h, cpp, hpp,
        cs, php, rb, swift, dart, vue, svelte 확장자만 별도 디렉터리에 해제한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: ["file"]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 파일 업로드 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileIdResponse"
        "400":
          description: 빈 파일, 잘못된 파일 이름, 손상된 ZIP 또는 ZIP Slip 위험 경로 (FILE_EMPTY, FILE_NAME_INVALID, ZIP_INVALID, ZIP_PATH_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 프로젝트가 없거나 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: 파일 크기 또는 ZIP 해제 제한 초과 (FILE_TOO_LARGE, ZIP_LIMIT_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: 지원하지 않는 형식 또는 형식 불일치 (FILE_TYPE_NOT_ALLOWED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: ZIP에 환경변수·인증서·키·실행 파일 포함 (ZIP_BLOCKED_CONTENT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 파일 저장소 처리 실패 (FILE_STORAGE_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: 프로젝트 파일 목록 조회
      parameters:
        - name: page
          in: query
          description: 0부터 시작하는 페이지 번호
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: 페이지당 파일 수
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: 생성 시각과 ID 내림차순 파일 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilePageResponse"
        "400":
          description: 잘못된 페이지 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 프로젝트가 없거나 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/projects/{projectId}/files/{fileId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: fileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: 프로젝트 파일 삭제
      responses:
        "204":
          description: 파일 메타데이터와 실제 파일 삭제 성공
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 프로젝트 또는 파일이 없거나 프로젝트 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 파일 저장소 처리 실패 (FILE_STORAGE_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/generations:
    post:
      summary: 보고서 생성 작업 시작
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "report-document.schema.json"
      responses:
        "202":
          description: 생성 작업 접수
          content:
            application/json:
              schema:
                type: object
                required: ["jobId"]
                properties:
                  jobId:
                    type: string
                    format: uuid

  /api/generations/{jobId}:
    get:
      summary: 생성 작업 상태 조회
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 생성 작업 상태
          content:
            application/json:
              schema:
                type: object
                required: ["jobId", "status"]
                properties:
                  jobId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: ["pending", "processing", "completed", "failed"]
                  reportId:
                    type: string
                    format: uuid

  /api/reports/{reportId}:
    get:
      summary: 보고서 조회
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 보고서 조회 성공
          content:
            application/json:
              schema:
                $ref: "report-document.schema.json"

    put:
      summary: 보고서 수정
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "report-document.schema.json"
      responses:
        "200":
          description: 보고서 수정 성공
          content:
            application/json:
              schema:
                $ref: "report-document.schema.json"
