  /api/projects/{projectId}/files:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: 프로젝트 파일 업로드
      description: |
        파일당 최대 크기는 20 MiB이다. PDF, DOCX, TXT, MD, ZIP, JPG/JPEG, PNG만 허용하며
        확장자, 요청 MIME, 실제 파일 형식이 모두 일치해야 한다. GIF와 WEBP는 MVP의
        보고서·AI 처리 호환 범위에서 제외되어 FILE_TYPE_NOT_ALLOWED로 거부된다.
        ZIP은 해제 용량 100 MiB와 내부 엔트리 1,000개로 제한하며 ZIP Slip, 환경변수,
        인증서·키, 실행 파일을 차단한다. java, kt, py, js, jsx, ts, tsx, html, css, scss,
        sql, xml, json, yaml, yml, md, txt, gradle, properties, toml, go, rs, c, h, cpp, hpp,
        cs, php, rb, swift, dart, vue, svelte 확장자만 별도 디렉터리에 해제한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: ["file"]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 파일 업로드 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileIdResponse"
        "400":
          description: 빈 파일, 잘못된 파일 이름, 손상된 PDF·ZIP 또는 ZIP Slip 위험 경로 (FILE_EMPTY, FILE_NAME_INVALID, PDF_INVALID, ZIP_INVALID, ZIP_PATH_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 프로젝트가 없거나 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: 파일 크기·PDF 페이지·ZIP 해제·사용자 업로드 quota 초과 (FILE_TOO_LARGE, PDF_PAGE_LIMIT_EXCEEDED, ZIP_LIMIT_EXCEEDED, UPLOAD_STORAGE_QUOTA_EXCEEDED, UPLOAD_FILE_QUOTA_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: 사용자별 업로드 요청 한도 초과 (RATE_LIMIT_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: 지원하지 않는 형식 또는 형식 불일치 (FILE_TYPE_NOT_ALLOWED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 암호화된 PDF 또는 ZIP에 환경변수·인증서·키·실행 파일 포함 (PDF_ENCRYPTED, ZIP_BLOCKED_CONTENT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 파일 저장소 처리 실패 (FILE_STORAGE_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
