# 프로덕션 단일 호스트 배포 스택 (Oracle Cloud 1 OCPU / 6GB, linux/arm64 기준)
#
#   docker compose --env-file .env.prod -f compose.prod.yaml up -d
#
# 이미지는 개발 머신에서 빌드해 GHCR에 올린다. 1 vCPU 서버에서 Gradle 빌드를
# 돌리면 매우 느리고 메모리도 부족하다.
name: devreport

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devreport
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    # 기본값은 이 사양에 과하다. 연결 수와 버퍼를 줄여 메모리를 아낀다.
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - max_connections=30
      - -c
      - effective_cache_size=768MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 768m
    networks: [internal]

  ai-service:
    image: ghcr.io/devreport-ai/devreport-ai-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MOCK_REPORT: "false"
      CONTRACTS_DIR: /contracts
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: "90"
      GENERATION_DEADLINE_SECONDS: "240"
      MAX_ANALYZED_IMAGES: "10"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    # 외부 포트를 열지 않는다. Backend만 내부 네트워크로 접근한다.
    networks: [internal]

  backend:
    image: ghcr.io/devreport-ai/devreport-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/devreport
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_MOCK: "false"
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      AI_SERVICE_RESPONSE_TIMEOUT: 300s
      # Chromium이 컨테이너 네트워크 안에서 접근하는 출력 전용 페이지 주소
      EXPORT_PRINT_URL: http://caddy/print/{exportId}
      # ARM 1 vCPU에서는 브라우저 콜드 스타트만 수 초가 걸려 30초로는 부족하다.
      EXPORT_RENDER_TIMEOUT: 60s
      UPLOAD_PATH: /data/uploads
      EXPORT_PATH: /data/generated-reports
      AUTH_REFRESH_TOKEN_COOKIE_SECURE: "true"
      # 같은 Origin으로 제공하므로 CORS allowlist를 비워 둔다.
      CORS_ALLOWED_ORIGINS: ""
    volumes:
      - app-data:/data
    # Chromium은 기본 64MB /dev/shm으로는 렌더 중 크래시한다.
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    mem_limit: 2g
    networks: [internal]

  caddy:
    image: ghcr.io/devreport-ai/devreport-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # 발급받은 인증서. 이 볼륨을 지우면 재발급되며 Let's Encrypt 한도를 소모한다.
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    networks: [internal]

volumes:
  postgres-data:
  app-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
