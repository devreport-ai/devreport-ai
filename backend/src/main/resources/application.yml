spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devreport}
    username: ${DATABASE_USERNAME:devreport}
    password: ${DATABASE_PASSWORD:devreport}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoint:
    health:
      show-components: when-authorized

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:3s}
    response-timeout: ${AI_SERVICE_RESPONSE_TIMEOUT:300s}
    mock: ${AI_SERVICE_MOCK:false}

auth:
  jwt-secret: ${JWT_SECRET:}
  access-token-ttl: 15m
  refresh-token-ttl: 14d

storage:
  upload-path: ${UPLOAD_PATH:./uploads}
